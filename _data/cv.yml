      - bullet: "Cai, Z. J., Zhang, Y. F., Tan, R., Lei, Z., and Ukkusuri, S. V. (2026). [Controllable Road Marking Generation](https://tjleizeng.github.io/publications/#cai2026roadmarking). Advances in Neural Information Processing Systems (NeurIPS), accepted."
