        date: 2024
        summary: Purdue University, 2024-2025 academic year.

      - name: NSF Innovation Corps Midwest Industry Connect Grant
        date: 2019
        summary: National Science Foundation I-Corps Midwest. Awarded for work on social ride-sharing.

      - name: "Chinese Patent: A Method for Evaluating Reserve Capacity of Urban Metro Networks"
        date: 2018

      - name: Peikun Transportation Talent Fund Award
        date: 2017
        summary: Tongji University.

      - name: 13th Competition of Transport Science, First Prize
        date: 2014
        summary: "Project: Research on Spatial Activity Patterns Based on Smartphone Data."

